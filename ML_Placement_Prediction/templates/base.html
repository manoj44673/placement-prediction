<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Placement Predictor{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ url_for('index') }}">Placement Predictor</a>
    <nav>
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('load_page') }}">Load Data</a>
      <a href="{{ url_for('eda_page') }}">EDA</a>
      <a href="{{ url_for('feature_engg_page') }}">Feature Engg</a>
      <a href="{{ url_for('linear_regression_page') }}">Linear Regression</a>
      <a href="{{ url_for('logistic_regression_page') }}">Logistic Regression</a>
      <a href="{{ url_for('predict') }}">     Predict Placement</a>
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container">
    <p>Placement Prediction Pipeline &mdash; simple ML interface</p>
  </div>
</footer>
</body>
</html>
